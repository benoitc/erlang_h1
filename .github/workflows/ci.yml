name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  REBAR3_VERSION: '3.27.0'

jobs:
  build:
    name: build (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          install-rebar: false
      - uses: actions/cache@v4
        id: rebar3
        with:
          path: ~/.local/rebar3
          key: rebar3-${{ env.REBAR3_VERSION }}
      - name: Download rebar3
        if: steps.rebar3.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-rebar3.sh "$REBAR3_VERSION" ~/.local/rebar3
      - run: echo "$HOME/.local/rebar3" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - run: rebar3 compile

  xref:
    name: xref (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          install-rebar: false
      - uses: actions/cache@v4
        id: rebar3
        with:
          path: ~/.local/rebar3
          key: rebar3-${{ env.REBAR3_VERSION }}
      - name: Download rebar3
        if: steps.rebar3.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-rebar3.sh "$REBAR3_VERSION" ~/.local/rebar3
      - run: echo "$HOME/.local/rebar3" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: xref-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - run: rebar3 xref

  dialyze:
    name: dialyze (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          install-rebar: false
      - uses: actions/cache@v4
        id: rebar3
        with:
          path: ~/.local/rebar3
          key: rebar3-${{ env.REBAR3_VERSION }}
      - name: Download rebar3
        if: steps.rebar3.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-rebar3.sh "$REBAR3_VERSION" ~/.local/rebar3
      - run: echo "$HOME/.local/rebar3" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: dialyze-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - run: rebar3 dialyzer

  test:
    name: test (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          install-rebar: false
      - uses: actions/cache@v4
        id: rebar3
        with:
          path: ~/.local/rebar3
          key: rebar3-${{ env.REBAR3_VERSION }}
      - name: Download rebar3
        if: steps.rebar3.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/fetch-rebar3.sh "$REBAR3_VERSION" ~/.local/rebar3
      - run: echo "$HOME/.local/rebar3" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: test-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - run: rebar3 eunit
      - run: rebar3 ct
