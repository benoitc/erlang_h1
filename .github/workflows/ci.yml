name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.24.0'
      - uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: build-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - run: rebar3 compile

  xref:
    name: xref (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.24.0'
      - uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: xref-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - run: rebar3 xref

  dialyze:
    name: dialyze (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.24.0'
      - uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: dialyze-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - run: rebar3 dialyzer

  test:
    name: test (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ['27', '28', '29']
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: '3.24.0'
      - uses: actions/cache@v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: test-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - run: rebar3 eunit
      - run: rebar3 ct
